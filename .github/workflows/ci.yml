name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # The built package on this Node version (ESM, CommonJS, seeded result).
      - run: npm run check:runtime
      # The engine's own correctness checks: every produced solution is
      # validated independently of the engine, and with --check-invariants the
      # propagation state is recomputed from scratch after every step.
      - name: Stress test (isometric tileset)
        run: npm run stress-test -- --runs 200 --fast --quiet
      - name: Stress test (random tilesets, backtracking and restarts, invariants checked)
        run: >
          npm run stress-test -- --tileset random --random-tiles 32 --random-labels 6
          --width 6 --height 6 --runs 100 --restart-after 2 --check-invariants --allow-failures --quiet

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Packs the library and uses the tarball as a consumer would (ESM, CJS,
      # TypeScript, the browser bundle, a browser bundler), with the TypeScript
      # versions we support: 4.5 is the oldest that can read the declarations.
      - run: npm run check:package
        env:
          CHECK_TS_VERSIONS: "4.5 4.7 4.9 5.0 5.4 5.9"
